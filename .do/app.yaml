# DigitalOcean App Platform spec — Rollaway frontend (static site).
#
# Usage:  doctl apps create --spec .do/app.yaml
#         (or import via the DO dashboard: Apps -> Create App -> Edit Spec)
#
# Production deploys from the integrated default branch.
# Set the SECRET value for VITE_MAPBOX_TOKEN in the dashboard — never commit it.

name: rollaway
region: sfo

static_sites:
  - name: rollaway-frontend
    github:
      repo: nathansso/RollAway
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm ci && npm run build
    output_dir: dist
    # SPA routing: serve index.html for every path.
    catchall_document: index.html
    envs:
      # Mapbox public token (pk.*). Paste the value in the DO dashboard;
      # it is baked into the JS bundle at build time.
      - key: VITE_MAPBOX_TOKEN
        type: SECRET
        scope: BUILD_TIME
      # Native structured recommendation endpoint.
      - key: VITE_RECOMMEND_SPOTS_URL
        scope: BUILD_TIME
        value: ""
      # Base-layer and permit endpoints. Empty while fixture mode is enabled.
      - key: VITE_VENDORS_URL
        scope: BUILD_TIME
        value: ""
      - key: VITE_CLOSURES_URL
        scope: BUILD_TIME
        value: ""
      - key: VITE_PERMIT_CHECKLIST_URL
        scope: BUILD_TIME
        value: ""
      # "true" = deterministic, zero-network API fixtures.
      - key: VITE_USE_FIXTURES
        scope: BUILD_TIME
        value: "true"
      - key: VITE_FIXTURE_DELAY_MS
        scope: BUILD_TIME
        value: "1100"
