# DigitalOcean Functions project spec — deploy with:
#   doctl serverless deploy functions
# Env values are substituted from functions/.env at deploy time (create it
# from functions/.env.example; never commit it). All four vars must EXIST in
# .env (empty values are fine — functions degrade to documented fixtures).
packages:
  - name: rollaway
    environment:
      SOCRATA_APP_TOKEN: "${SOCRATA_APP_TOKEN}"
      GOOGLE_PLACES_KEY: "${GOOGLE_PLACES_KEY}"
      # Server-side Google key for recommend_spots: Distance Matrix (traffic)
      # + Geocoding (issue #17). Not referrer-restricted; keep server-only.
      GOOGLE_MAPS_SERVER_KEY: "${GOOGLE_MAPS_SERVER_KEY}"
      TICKETMASTER_KEY: "${TICKETMASTER_KEY}"
      # doctl 1.163 refuses to substitute vars whose .env value is EMPTY, and
      # these two are intentionally empty in production (empty = bundled SFMTA
      # sample / live-data mode). Hardcoded ""; restore the dollar-brace
      # substitution (it scans comments too!) if you ever set a real value
      # in functions/.env.
      SFMTA_EVENTS_URL: ""
      DEMO_DATA_MODE: ""
      MAPBOX_TOKEN: "${MAPBOX_TOKEN}"
      FUNCTIONS_BASE_URL: "${FUNCTIONS_BASE_URL}"
      SPOT_SCOUT_URL: "${SPOT_SCOUT_URL}"
      MENU_RAG_URL: "${MENU_RAG_URL}"
      # Phase 2 (Supabase): get_foot_traffic reads station_hourly via PostgREST
      # (anon key, read-only tables). Empty => bundled station_hourly.json.
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
    functions:
      - name: get_vendors
        runtime: "nodejs:18"
        web: true
        limits:
          timeout: 30000   # ms — covers Socrata retry/backoff worst case
          memory: 256
      - name: get_closures
        runtime: "nodejs:18"
        web: true
        limits:
          timeout: 30000
          memory: 256
      - name: get_foot_traffic
        runtime: "nodejs:18"
        web: true
        limits:
          timeout: 30000
          memory: 256
      - name: get_restaurants
        runtime: "nodejs:18"
        web: true
        limits:
          timeout: 30000
          memory: 256
      - name: get_events
        runtime: "nodejs:18"
        web: true
        limits:
          timeout: 30000
          memory: 256
      - name: check_clearance
        runtime: "nodejs:18"
        web: true
        limits:
          timeout: 30000
          memory: 512    # turf + citywide sidewalk/hydrant/school snapshots
      - name: recommend_spots
        runtime: "nodejs:18"
        web: true
        limits:
          timeout: 30000   # orchestrates the six base functions + Mapbox + Spot Scout
          memory: 512
